<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShareHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">ShareHub</a>
            <a href="/" class="btn btn-outline-light btn-sm">Home</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="form-card mx-auto">
            <h2 class="text-center mb-4">Create an Account</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label" for="name">Full Name</label>
                    <input class="form-control" type="text" id="name" name="name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-control" type="email" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" minlength="6" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="role">Register As</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="student">Student</option>
                        <option value="owner">Resource Owner</option>
                    </select>
                </div>

                <button class="btn btn-primary w-100" type="submit">Create Account</button>
            </form>

            <p class="text-center mt-3">
                Already registered?
                <a href="{{ url_for('login') }}">Login</a>
            </p>
        </div>
    </main>
</body>
</html>

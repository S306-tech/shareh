<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Booking - ShareHub</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="booking-page">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">ShareHub</a>

            <a href="/" class="btn btn-outline-light btn-sm">
                Back to Home
            </a>
        </div>
    </nav>

    <!-- Booking Form Section -->
    <div class="container py-5">

        <div class="booking-container mx-auto">

            <h2 class="text-center fw-bold mb-2">
                Request a Booking
            </h2>

            <p class="text-center text-muted mb-4">
                Fill in your details to request a resource.
            </p>

            <form action="{{ url_for('request_booking') }}" method="POST">

                <!-- Resource Name -->
                <div class="mb-3">
                    <label for="resource" class="form-label">
                        Selected Resource
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="resource"
                        name="resource"
                        value="{{ resource }}"
                        readonly
                        required>
                </div>

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <!-- Booking Date -->
                <div class="mb-3">
                    <label for="date" class="form-label">
                        Required Date
                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="date"
                        name="date"
                        required>
                </div>

                <!-- Purpose -->
                <div class="mb-4">
                    <label for="purpose" class="form-label">
                        Purpose of Booking
                    </label>

                    <textarea
                        class="form-control"
                        id="purpose"
                        name="purpose"
                        rows="4"
                        placeholder="Explain why you need this resource"
                        required></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100">
                    Submit Booking Request
                </button>

            </form>

            <p class="text-center mt-3 mb-0">
                <small class="text-muted">
                    Your request will be submitted for approval.
                </small>
            </p>

        </div>

    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 ShareHub</p>
    </footer>

</body>
</html>

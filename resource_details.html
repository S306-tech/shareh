<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ resource.name }} - ShareHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">ShareHub</a>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('explore') }}">Back to Explore</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="content-card mx-auto">
            {% if resource.image %}
            <img src="{{ url_for('static', filename=resource.image) }}"
                 class="img-fluid rounded mb-4"
                 alt="{{ resource.name }}">
            {% endif %}

            <h1>{{ resource.name }}</h1>
            <p>{{ resource.description }}</p>
            <p><strong>Location:</strong> {{ resource.location }}</p>
            <p><strong>Availability:</strong> {{ resource.availability }}</p>

            <a href="{{ url_for('request_booking', resource=resource.name) }}"
               class="btn btn-primary">Request Booking</a>
        </div>
    </main>
</body>
</html>
